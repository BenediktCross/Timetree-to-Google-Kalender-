name: TimeTree Einrichtung prüfen

on:
  push:
    branches: [main]
    paths: [.github/workflows/calendar-setup.yml, sync.py]

permissions:
  contents: read

concurrency:
  group: timetree-google-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Offline-Schutztests
        run: python -m unittest discover -s tests -v
      - name: Kalender abgleichen
        env:
          TIMETREE_SESSION_ID: ${{ secrets.TIMETREE_SESSION_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SYNC_CONFIG_JSON: ${{ secrets.SYNC_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import os
          from collections import Counter
          import requests
          from sync import fetch_source, load_config, is_deleted, event_body, SyncError
          cfg = load_config('config.json')
          with requests.Session() as session:
              for c in cfg['calendars']:
                  items = fetch_source(session, c['timetree_calendar_id'], os.environ['TIMETREE_SESSION_ID'])
                  ids = {str(e['id']): e for e in items}
                  uuids = {str(e['uuid']): e for e in items if e.get('uuid')}
                  counts = Counter()
                  cases = Counter()
                  errors = Counter()
                  for event in items:
                      if is_deleted(event):
                          counts['deleted'] += 1
                          continue
                      if event.get('category') == 2:
                          counts['memo'] += 1
                          continue
                      counts['active'] += 1
                      try:
                          body = event_body(event, c)
                          counts['unspecified_end'] += int(bool(body.get('endTimeUnspecified')))
                      except SyncError as error:
                          errors[str(error)] += 1
                      pid, uid = event.get('parent_id'), event.get('recurring_uuid')
                      has_pid = pid not in (None, 0, '0', '')
                      if not has_pid and not uid:
                          continue
                      parent = ids.get(str(pid)) if has_pid else uuids.get(str(uid))
                      child_rules = event.get('recurrences') or []
                      parent_rules = (parent or {}).get('recurrences') or []
                      cases[(has_pid, bool(uid), bool(parent), parent is event, bool(parent and is_deleted(parent)),
                             bool(parent and uid and parent.get('uuid') != uid), bool(child_rules),
                             any(str(r).startswith('RRULE:') for r in parent_rules),
                             any(str(r).startswith(('EXDATE:', 'EXDATE;')) for r in parent_rules),
                             any('UNTIL=' in str(r) or 'COUNT=' in str(r) for r in parent_rules),
                             bool(parent and parent.get('start_at', 0) < event.get('start_at', 0))) ] += 1
                  print('FORMAT_COUNTS', dict(counts))
                  print('FORMAT_ERRORS', dict(errors))
                  print('LINK_LABELS', 'parent_id recurring_uuid parent_found parent_is_self parent_deleted parent_uuid_diff child_recurrence parent_rule parent_exdate parent_bounded parent_starts_earlier')
                  for shape, count in cases.items():
                      print('LINK_COUNTS', count, *map(int, shape))
          PY
