name: TimeTree Einrichtung prüfen

on:
  push:
    branches: [main]
    paths: [.github/workflows/calendar-setup.yml]

permissions:
  contents: read

concurrency:
  group: timetree-google-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Offline-Schutztests
        run: python -m unittest discover -s tests -v
      - name: Kalender abgleichen
        env:
          TIMETREE_SESSION_ID: ${{ secrets.TIMETREE_SESSION_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SYNC_CONFIG_JSON: ${{ secrets.SYNC_CONFIG_JSON }}
        run: python sync.py
