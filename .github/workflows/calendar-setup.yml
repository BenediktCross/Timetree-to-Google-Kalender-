name: TimeTree Einrichtung prüfen

on:
  push:
    branches: [main]
    paths: [.github/workflows/calendar-setup.yml, sync.py]

permissions:
  contents: read

concurrency:
  group: timetree-google-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Offline-Schutztests
        run: python -m unittest discover -s tests -v
      - name: Kalender abgleichen
        env:
          TIMETREE_SESSION_ID: ${{ secrets.TIMETREE_SESSION_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SYNC_CONFIG_JSON: ${{ secrets.SYNC_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import hashlib, os, time
          import requests
          from sync import Google, google_session, load_config, request_json, is_deleted, SyncError
          cfg = load_config('config.json')
          with requests.Session() as session:
              for c in cfg['calendars']:
                  match = hashlib.sha256(("timetree-target-check-799c7065033f" + c['google_calendar_id']).encode()).hexdigest() == "54272e749e296232ede2f2dcc8271f36cd26faf7aeb062cf49ded1704233cf84"
                  print('TARGET_ID_MATCH', match)
                  print('TARGET_NAME_MATCH', c['expected_google_calendar_name'] == 'TimeTree')
                  print('ABSENCE_DELETIONS_ENABLED', c['full_snapshot_confirmed'])
                  cid = c['timetree_calendar_id']
                  delta = f'https://timetreeapp.com/api/v1/calendar/{cid}/events'
                  try:
                      _, data = request_json(session, 'GET', delta, label='TimeTree',
                                            params={'since': int((time.time() - 90*86400)*1000)},
                                            headers={'x-timetreea':'web/2.1.0/ja','Accept':'application/json'},
                                            cookies={'_session_id':os.environ['TIMETREE_SESSION_ID']})
                      events = data.get('events')
                      if isinstance(events, list):
                          print('DELTA_CHECK', len(events), sum(is_deleted(e) for e in events), type(data.get('chunk')).__name__, bool(data.get('chunk')), type(data.get('since')).__name__)
                      else:
                          print('DELTA_CHECK missing event list')
                  except SyncError as exc:
                      print('DELTA_CHECK', str(exc))
                  google = Google(google_session())
                  try:
                      entries = google.preflight(c['google_calendar_id'], c['expected_google_calendar_name'])
                      print('GOOGLE_PREFLIGHT_OK', len(entries))
                  except SyncError as exc:
                      print('GOOGLE_PREFLIGHT_ERROR', str(exc))
                      raise SystemExit(1)
          PY
