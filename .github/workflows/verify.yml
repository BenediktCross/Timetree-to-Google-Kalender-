name: Code und Schutztests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Abhängigkeiten prüfen
        run: python -m pip check
      - name: Offline-Schutztests
        run: python -m unittest discover -s tests -v
      - name: Quellformat mit erfundenem Termin prüfen
        run: python sync.py --config config.example.json --snapshot examples/snapshot.example.json --probe
