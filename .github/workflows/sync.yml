name: TimeTree nach Google Kalender

on:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths: [.github/workflows/sync.yml, sync.py]
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = nur TimeTree, dry-run = Plan, apply = schreiben'
        required: true
        default: dry-run
        type: choice
        options:
          - probe
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: timetree-google-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' || vars.SYNC_ENABLED != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Offline-Schutztests
        run: python -m unittest discover -s tests -v
      - name: Kalender abgleichen
        env:
          TIMETREE_SESSION_ID: ${{ secrets.TIMETREE_SESSION_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SYNC_CONFIG_JSON: ${{ secrets.SYNC_CONFIG_JSON }}
          MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" || "$MODE" == "apply" ]]; then
            python sync.py --apply
          elif [[ "$MODE" == "probe" ]]; then
            python sync.py --probe
          else
            python sync.py
          fi
